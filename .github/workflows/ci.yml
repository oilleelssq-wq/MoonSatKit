name: moonbit-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash

      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: moon fmt --check

      - name: Check package
        run: moon check --deny-warn

      - name: Run tests
        run: moon test -p oillee/moonsatkit --target all --deny-warn

      - name: Check browser adapter
        run: moon check web/wasm --target wasm --deny-warn

      - name: Build browser adapter
        run: moon build web/wasm --target js --release